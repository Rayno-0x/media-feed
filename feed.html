<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaFeed — Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body class="mf-app" data-page="feed" data-rail="true">
    <a class="mf-skip" href="#feedList">Skip to feed</a>

    <main class="mf-main" id="mfMain">
      <!-- Stories: people you follow -->
      <section class="mf-stories" id="storiesRow" aria-label="Stories"></section>

      <!-- Composer trigger -->
      <section class="mf-card">
        <div class="mf-composer-trigger">
          <img class="mf-avatar" src="./assets/images/icons/avatar_icon.png" alt="" width="42" height="42" id="composerAvatar"/>
          <input type="text" id="composerOpenBtn" placeholder="What are you creating today?" readonly aria-label="Create a post"/>
        </div>
        <div class="mf-composer-types">
          <button class="mf-type-chip" data-compose-type="gallery">${}</button>
          <button class="mf-type-chip" data-compose-type="update">${}</button>
          <button class="mf-type-chip" data-compose-type="blog">${}</button>
          <button class="mf-type-chip" data-goto="create.html?type=article">${}</button>
          <button class="mf-type-chip" data-goto="create.html?type=music">${}</button>
          <button class="mf-type-chip" data-goto="create.html?type=video">${}</button>
        </div>
      </section>

      <!-- Filter tabs -->
      <nav class="mf-tabs" id="feedTabs" aria-label="Feed filters">
        <button class="mf-tab active" data-filter="all">All</button>
        <button class="mf-tab" data-filter="gallery">Gallery</button>
        <button class="mf-tab" data-filter="article">Articles</button>
        <button class="mf-tab" data-filter="blog">Blogs</button>
        <button class="mf-tab" data-filter="music">Music</button>
        <button class="mf-tab" data-filter="video">Videos</button>
        <button class="mf-tab" data-filter="update">Updates</button>
      </nav>

      <!-- Posts -->
      <section id="feedList" class="mf-feed-list" aria-live="polite"></section>
    </main>

    <!-- Quick compose modal -->
    <div class="mf-modal" id="composeModal" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
      <div class="mf-modal-panel">
        <div class="mf-modal-head">
          <h3 id="composeTitle">Create a post</h3>
          <button class="mf-icon-btn mf-modal-close" type="button" aria-label="Close"></button>
        </div>
        <div class="mf-modal-body">
          <div class="mf-field">
            <label>Post type</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap" id="composeTypes">
              <button type="button" class="mf-tab active" data-type="update">Update</button>
              <button type="button" class="mf-tab" data-type="gallery">Gallery</button>
              <button type="button" class="mf-tab" data-type="blog">Blog</button>
            </div>
            <p class="mf-hint">For Articles, Music or Videos use the full creator.</p>
          </div>

          <div class="mf-field">
            <textarea id="composeText" class="mf-textarea"
              placeholder="Share your work, thoughts or latest update… use #tags to get discovered"></textarea>
          </div>

          <div class="mf-field">
            <label>Add an image <em style="font-weight:400">(optional)</em></label>
            <label class="mf-dropzone" id="composeDrop">
              <input type="file" id="composeImage" accept="image/*" hidden />
              <span>Click to choose an image, or drag it here</span>
              <span class="mf-dropzone-preview" id="composePreview" hidden><img alt="" /></span>
            </label>
          </div>

          <div class="mf-field">
            <input type="text" id="composeTags" class="mf-input" placeholder="Tags, comma separated (e.g. design, music)" autocomplete="off"/>
          </div>

          <p class="mf-error" id="composeError"></p>

          <button class="mf-btn mf-btn-primary" id="publishBtn" style="width:100%;padding:13px">Publish post</button>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/feed.js"></script>
  </body>
</html>
