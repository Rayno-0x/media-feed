<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaFeed — Music</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/music.css" />
  </head>

  <body class="mf-app" data-page="music" data-rail="true">
    <a class="mf-skip" href="#trackRows">Skip to tracks</a>

    <main class="mf-main">
      <div class="mf-page-head">
        <div>
          <h1 class="mf-page-title">Music</h1>
          <p class="mf-page-sub">Your artist home on MediaFeed</p>
        </div>
        <a class="mf-btn mf-btn-primary mf-btn-sm" href="create.html?type=music">Upload track</a>
      </div>

      <!-- Creator stats -->
      <section id="myStats" class="stat-grid" aria-label="Your music stats"></section>

      <!-- Featured artist spotlight -->
      <section id="spotlight"></section>

      <h2 class="music-section-title">Trending tracks</h2>
      <section id="trackRows" aria-live="polite"></section>

      <!-- Artist tools -->
      <section id="artistTools"></section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/music.js"></script>
  </body>
</html>
