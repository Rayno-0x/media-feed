<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaFeed — Post</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/post.css" />
  </head>

  <body class="mf-app" data-page="post">
    <a class="mf-skip" href="#postWrap">Skip to post</a>

    <main class="mf-main">
      <button class="mf-btn mf-btn-ghost mf-btn-sm mf-back" id="backBtn"></button>

      <div id="postWrap"></div>

      <section class="mf-card" id="commentsCard" hidden>
        <div class="mf-comments-inner">
          <h3 class="mf-section-h" id="commentsTitle">Comments</h3>
          <div id="commentsList"></div>
          <form class="mf-comment-form" id="commentForm">
            <img class="mf-avatar" id="meAvatar" width="36" height="36" alt=""/>
            <input class="mf-input" id="commentInput" placeholder="Add a comment…" autocomplete="off" required/>
            <button class="mf-btn mf-btn-primary" type="submit">Post</button>
          </form>
        </div>
      </section>

      <section id="moreFrom">
        <h2 class="mf-page-title" style="font-size:1.15rem">More from this creator</h2>
        <div id="moreList"></div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/post.js"></script>
  </body>
</html>
