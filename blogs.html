<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaFeed — Articles &amp; Blogs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/blogs.css" />
  </head>

  <body class="mf-app" data-page="blogs" data-rail="true">
    <a class="mf-skip" href="#readerList">Skip to articles</a>

    <main class="mf-main">
      <div class="mf-page-head">
        <div>
          <h1 class="mf-page-title">Articles &amp; Blogs</h1>
          <p class="mf-page-sub">Long reads and stories from the community</p>
        </div>
        <a class="mf-btn mf-btn-primary mf-btn-sm" href="create.html?type=article">Write</a>
      </div>

      <nav class="mf-tabs" id="readerTabs">
        <button class="mf-tab active" data-filter="all">All</button>
        <button class="mf-tab" data-filter="article">Articles</button>
        <button class="mf-tab" data-filter="blog">Blogs</button>
      </nav>

      <section id="readerList" aria-live="polite"></section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/blogs.js"></script>
  </body>
</html>
