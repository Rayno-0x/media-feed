<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaFeed — Notifications</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/notifications.css" />
  </head>

  <body class="mf-app" data-page="notifications">
    <a class="mf-skip" href="#notifList">Skip to notifications</a>

    <main class="mf-main">
      <div class="mf-page-head">
        <div>
          <h1 class="mf-page-title">Notifications</h1>
          <p class="mf-page-sub" id="notifSub"></p>
        </div>
        <button class="mf-btn mf-btn-ghost mf-btn-sm" id="markAllBtn">
          Mark all read
        </button>
      </div>

      <nav class="mf-tabs" id="notifTabs" aria-label="Notification filters">
        <button class="mf-tab active" data-tab="all">All</button>
        <button class="mf-tab" data-tab="like">Likes</button>
        <button class="mf-tab" data-tab="follow">Follows</button>
        <button class="mf-tab" data-tab="comment">Comments</button>
      </nav>

      <section id="notifList" aria-live="polite"></section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/notifications.js"></script>
  </body>
</html>
